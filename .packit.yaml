upstream_project_url: https://github.com/bottlesdevs/Bottles
upstream_package_name: Bottles
downstream_package_name: bottles

copy_upstream_release_description: false

jobs:
  - job: pull_from_upstream
    trigger: release
    dist_git_branches:
      - fedora-rawhide
  - job: koji_build

    trigger: commit
    dist_git_branches:
      - fedora-all
